<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=overview.html">
    <title>FocusForge — Redirecting to Dashboard Overview</title>

    <script>
        // Support both static local serving and Express server routing.
        const isStaticServer =
            window.location.protocol === 'file:' ||
            window.location.port === '5500';

        const target = isStaticServer
            ? 'overview.html'
            : '/dashboard/overview';

        window.location.replace(target);
    </script>
</head>

        <p>
            Redirecting to
            <a href="overview.html" style="color:#6366F1;">
                Dashboard Overview
            </a>...
        </p>
    </div>
</body>

</html>
